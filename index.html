<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         BASIC META
    ====================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Al Fan Emirates - Fashion, footwear and everyday essentials for the whole family across the UAE."
    />

    <meta
      name="theme-color"
      content="#17120b"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="https://i0.wp.com/alfaneim.com/wp-content/uploads/2021/05/AL-FAN-LOGO.png?w=540&ssl=1"
    />

    <!-- =====================================================
         TITLE
    ====================================================== -->

    <title>Al Fan Emirates</title>

    <!-- =====================================================
         NETLIFY FORMS DETECTION

         IMPORTANT:
         This hidden form is required because the actual
         Careers form is rendered by React.
    ====================================================== -->

    <form
      name="career-application"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <!-- Netlify form name -->
      <input
        type="hidden"
        name="form-name"
        value="career-application"
      />

      <!-- Honeypot -->
      <input
        type="text"
        name="bot-field"
        tabindex="-1"
        autocomplete="off"
      />

      <!-- =================================================
           FORM FIELDS

           These names MUST match the React form.
      ================================================== -->

      <input
        type="text"
        name="fullName"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="tel"
        name="phone"
      />

      <input
        type="text"
        name="position"
      />

      <input
        type="text"
        name="experience"
      />

      <textarea
        name="message"
      ></textarea>

      <!-- CV upload -->
      <input
        type="file"
        name="cv"
      />
    </form>

  </head>

  <body>

    <!-- =====================================================
         REACT APPLICATION
    ====================================================== -->

    <div id="root"></div>

    <!-- =====================================================
         VITE / REACT ENTRY
         
         DO NOT manually change the generated asset name.
         Vite will replace this during build.
    ====================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
