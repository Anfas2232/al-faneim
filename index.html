<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Al Fan Emirates - Fashion, footwear and everyday essentials for the whole family across the UAE."
    />

    <link
      rel="icon"
      type="image/png"
      href="https://i0.wp.com/alfaneim.com/wp-content/uploads/2021/05/AL-FAN-LOGO.png?w=540&ssl=1"
    />

    <title>Al Fan Emirates</title>
  </head>

  <body>

    <!-- Netlify Forms detection -->
    <form
      name="career-application"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="career-application"
      />

      <input
        type="text"
        name="bot-field"
      />

      <input
        type="text"
        name="fullName"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="tel"
        name="phone"
      />

      <input
        type="text"
        name="position"
      />

      <input
        type="text"
        name="experience"
      />

      <textarea name="message"></textarea>

      <input
        type="file"
        name="cv"
      />
    </form>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
