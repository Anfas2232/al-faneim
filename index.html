<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Al Fan Emirates - Fashion, footwear and everyday essentials for the whole family across the UAE."
    />

    <meta
      name="theme-color"
      content="#17120b"
    />

    <link
      rel="icon"
      type="image/png"
      href="https://i0.wp.com/alfaneim.com/wp-content/uploads/2021/05/AL-FAN-LOGO.png?w=540&ssl=1"
    />

    <title>Al Fan Emirates</title>

    <!-- =====================================================
         NETLIFY FORMS STATIC FORM DETECTION

         IMPORTANT:
         This form is hidden from visitors but Netlify scans
         it during deployment.
    ====================================================== -->

    <form
      name="career-application"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <!-- Form name -->
      <input
        type="hidden"
        name="form-name"
        value="career-application"
      />

      <!-- Honeypot -->
      <input
        type="text"
        name="bot-field"
        tabindex="-1"
        autocomplete="off"
      />

      <!-- Full Name -->
      <input
        type="text"
        name="fullName"
      />

      <!-- Email -->
      <input
        type="email"
        name="email"
      />

      <!-- Phone -->
      <input
        type="tel"
        name="phone"
      />

      <!-- Position -->
      <input
        type="text"
        name="position"
      />

      <!-- Experience -->
      <input
        type="text"
        name="experience"
      />

      <!-- Message -->
      <textarea
        name="message"
      ></textarea>

      <!-- CV -->
      <input
        type="file"
        name="cv"
      />
    </form>

  </head>

  <body>

    <!-- React -->
    <div id="root"></div>

    <!-- Vite entry -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
